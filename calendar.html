<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>신나는 달력 탐험대! 📅</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 12px; background: #e0f2fe; color: #1e293b; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { margin: 5px 0 10px; font-size: 1.5rem; color: #0284c7; text-align: center; text-shadow: 1px 1px 0 #fff; }
  
  .game-card { background: white; border-radius: 20px; padding: 16px; width: 100%; max-width: 480px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 12px; }
  
  /* 모드 선택 탭 */
  .mode-tabs { display: flex; gap: 6px; background: #f1f5f9; padding: 4px; border-radius: 14px; }
  .tab-btn { flex: 1; padding: 8px 4px; border: none; border-radius: 10px; font-size: 0.85rem; font-weight: bold; color: #64748b; background: transparent; cursor: pointer; transition: 0.2s; }
  .tab-btn.active { background: #0ea5e9; color: white; box-shadow: 0 2px 6px rgba(14,165,233,0.3); }

  /* 월 변경 네비게이션 컨트롤 */
  .month-control-bar { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 6px 12px; }
  .btn-nav-month { background: #38bdf8; color: white; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #0284c7; }
  .btn-nav-month:active { transform: translateY(2px); box-shadow: none; }
  .month-select { font-size: 1.15rem; font-weight: bold; color: #0f172a; border: none; background: transparent; outline: none; cursor: pointer; text-align-last: center; }
  .score-badge { font-size: 0.95rem; font-weight: bold; color: #0284c7; background: #e0f2fe; padding: 4px 10px; border-radius: 20px; }

  /* 미션 배너 */
  .mission-box { background: #fef3c7; border: 2px solid #fde68a; border-radius: 16px; padding: 12px; text-align: center; position: relative; }
  .mission-badge { position: absolute; top: -10px; left: 16px; background: #f59e0b; color: white; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; }
  .mission-text { font-size: 1.15rem; font-weight: bold; color: #78350f; margin-top: 4px; line-height: 1.4; word-break: keep-all; }
  .mission-sub { font-size: 0.85rem; color: #b45309; margin-top: 4px; }

  /* 달력 그리드 */
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.1s; user-select: none; position: relative; }
  .day-header { font-size: 0.85rem; color: #64748b; padding-bottom: 4px; cursor: default; }
  .day-header.sun { color: #ef4444; }
  .day-header.sat { color: #3b82f6; }

  /* 날짜 스타일 */
  .date-cell { background: #f8fafc; border: 1px solid #e2e8f0; }
  .date-cell:active { transform: scale(0.92); }
  .date-cell.sun { color: #ef4444; background: #fef2f2; border-color: #fee2e2; }
  .date-cell.sat { color: #3b82f6; background: #eff6ff; border-color: #dbeafe; }
  .date-cell.today-marker { border: 2px solid #f59e0b; background: #fffbeb; }
  .date-cell.today-marker::after { content: "오늘"; position: absolute; bottom: 2px; font-size: 0.55rem; color: #d97706; font-weight: normal; }
  
  /* 피드백 애니메이션 */
  .date-cell.correct-anim { animation: popCorrect 0.5s ease; background: #86efac !important; color: #065f46 !important; border-color: #4ade80 !important; }
  .date-cell.wrong-anim { animation: shakeWrong 0.4s ease; background: #fca5a5 !important; color: #991b1b !important; }

  @keyframes popCorrect { 0%{transform: scale(1);} 50%{transform: scale(1.2);} 100%{transform: scale(1);} }
  @keyframes shakeWrong { 0%,100%{transform: translateX(0);} 25%{transform: translateX(-5px);} 75%{transform: translateX(5px);} }

  /* 주먹 뼈 모드 전용 */
  .knuckle-view { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 10px 0; }
  .knuckle-graphic { font-size: 3.5rem; letter-spacing: 6px; }
  .knuckle-question { font-size: 1.3rem; font-weight: bold; color: #0369a1; text-align: center; }
  .knuckle-options { display: flex; gap: 12px; width: 100%; }
  .knuckle-btn { flex: 1; padding: 16px; border-radius: 16px; border: 2px solid; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .btn-31 { border-color: #f59e0b; background: #fffbeb; color: #b45309; }
  .btn-30 { border-color: #64748b; background: #f8fafc; color: #334155; }
  .knuckle-btn:active { transform: scale(0.96); }

  /* 피드백 배너 */
  .feedback-banner { min-height: 28px; text-align: center; font-size: 1.1rem; font-weight: bold; }
  .fb-good { color: #16a34a; }
  .fb-bad { color: #dc2626; }
</style>
</head>
<body>

<h1>🧭 신나는 달력 탐험대!</h1>

<div class="game-card">
  <!-- 모드 선택 -->
  <div class="mode-tabs">
    <button class="tab-btn active" onclick="switchGameMode('date')">🎯 날짜 콕콕</button>
    <button class="tab-btn" onclick="switchGameMode('relative')">🚀 어제·오늘·내일</button>
    <button class="tab-btn" onclick="switchGameMode('knuckle')">✊ 주먹뼈 마술</button>
  </div>

  <!-- 달력 뷰 영역 -->
  <div id="calendarView">
    <!-- 월 변경 컨트롤 바 (이전달, 선택 드롭다운, 다음달) -->
    <div class="month-control-bar">
      <button class="btn-nav-month" onclick="prevMonth()">◀</button>
      <select id="monthSelect" class="month-select" onchange="onMonthSelect(this.value)">
        <!-- 1월~12월 동적 생성 -->
      </select>
      <button class="btn-nav-month" onclick="nextMonth()">▶</button>
      <div class="score-badge" id="scoreDisplay">⭐ 0점</div>
    </div>

    <!-- 미션 카드 -->
    <div class="mission-box" style="margin-top: 10px;">
      <div class="mission-badge" id="missionBadge">미션</div>
      <div class="mission-text" id="missionTitle">문제를 불러오는 중...</div>
      <div class="mission-sub" id="missionSub">달력에서 알맞은 날짜를 터치하세요!</div>
    </div>

    <!-- 달력 본체 -->
    <div class="calendar-grid" id="calendarGrid" style="margin-top: 10px;">
      <div class="cal-cell day-header sun">일</div>
      <div class="cal-cell day-header">월</div>
      <div class="cal-cell day-header">화</div>
      <div class="cal-cell day-header">수</div>
      <div class="cal-cell day-header">목</div>
      <div class="cal-cell day-header">금</div>
      <div class="cal-cell day-header sat">토</div>
    </div>
  </div>

  <!-- 주먹뼈 퀴즈 모드 뷰 -->
  <div class="knuckle-view" id="knuckleView">
    <div class="month-control-bar" style="width: 100%;">
      <span style="font-size:1.15rem; font-weight:bold; color:#0f172a;">✊ 주먹뼈 31일 탐험</span>
      <div class="score-badge" id="scoreKnuckleDisplay">⭐ 0점</div>
    </div>
    <div class="knuckle-graphic">⛰️ 🕳️ ⛰️ 🕳️</div>
    <div class="knuckle-question" id="knuckleMonthText">5월은 며칠까지 있을까?</div>
    <p style="font-size:0.9rem; color:#64748b; margin:0; text-align:center;">
      주먹 뼈 봉우리는 <b>31일</b>! 쏙 들어간 골짜기는 <b>30일(또는 28일)</b>!
    </p>
    <div class="knuckle-options">
      <button class="knuckle-btn btn-31" onclick="answerKnuckle(31)">
        <span>⛰️ 산 봉우리</span>
        <span>31일까지!</span>
      </button>
      <button class="knuckle-btn btn-30" onclick="answerKnuckle(30)">
        <span>🕳️ 쏙 골짜기</span>
        <span>30일까지! (2월은 28일)</span>
      </button>
    </div>
  </div>

  <!-- 피드백 메시지 -->
  <div class="feedback-banner" id="feedbackMsg"></div>
</div>

<script>
const YEAR = 2026;
let currentMonth = 9; // 9월 기본
let currentMode = 'date';
let score = 0;
let currentQuestion = null;
let isWaiting = false;

const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

const MONTH_DAYS = {
  1: 31, 2: 28, 3: 31, 4: 30, 5: 31, 6: 30,
  7: 31, 8: 31, 9: 30, 10: 31, 11: 30, 12: 31
};

window.onload = () => {
  initMonthSelect();
  renderCalendar();
  newQuestion();
};

function initMonthSelect() {
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = `${YEAR}년 ${m}월`;
    if (m === currentMonth) opt.selected = true;
    sel.appendChild(opt);
  }
}

function onMonthSelect(val) {
  currentMonth = parseInt(val);
  renderCalendar();
  newQuestion();
}

function prevMonth() {
  if (currentMonth > 1) {
    currentMonth--;
  } else {
    currentMonth = 12;
  }
  document.getElementById('monthSelect').value = currentMonth;
  renderCalendar();
  newQuestion();
}

function nextMonth() {
  if (currentMonth < 12) {
    currentMonth++;
  } else {
    currentMonth = 1;
  }
  document.getElementById('monthSelect').value = currentMonth;
  renderCalendar();
  newQuestion();
}

// 해당 월의 1일 요일과 총 일수 계산
function getMonthData(year, month) {
  const firstDayWeekday = new Date(year, month - 1, 1).getDay();
  const totalDays = new Date(year, month, 0).getDate();
  return { firstDayWeekday, totalDays };
}

function renderCalendar() {
  const { firstDayWeekday, totalDays } = getMonthData(YEAR, currentMonth);
  const grid = document.getElementById('calendarGrid');

  while (grid.children.length > 7) {
    grid.removeChild(grid.lastChild);
  }

  for (let i = 0; i < firstDayWeekday; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell';
    grid.appendChild(empty);
  }

  // 가상 기준일 '오늘': 각 월의 중간(12일~18일 사이)에 자동 배치
  const virtualToday = 15;

  for (let day = 1; day <= totalDays; day++) {
    const cell = document.createElement('div');
    const weekdayIdx = (firstDayWeekday + day - 1) % 7;
    cell.className = 'cal-cell date-cell';
    cell.textContent = day;
    cell.dataset.day = day;

    if (weekdayIdx === 0) cell.classList.add('sun');
    if (weekdayIdx === 6) cell.classList.add('sat');
    if (currentMode === 'relative' && day === virtualToday) {
      cell.classList.add('today-marker');
    }

    cell.onclick = () => onDateClicked(day, cell);
    grid.appendChild(cell);
  }
}

function switchGameMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', 
      (mode === 'date' && i === 0) || 
      (mode === 'relative' && i === 1) || 
      (mode === 'knuckle' && i === 2)
    );
  });

  const calView = document.getElementById('calendarView');
  const knkView = document.getElementById('knuckleView');

  if (mode === 'knuckle') {
    calView.style.display = 'none';
    knkView.style.display = 'flex';
  } else {
    calView.style.display = 'block';
    knkView.style.display = 'none';
    renderCalendar();
  }
  newQuestion();
}

function newQuestion() {
  isWaiting = false;
  document.getElementById('feedbackMsg').textContent = '';

  if (currentMode === 'date') {
    generateDateQuestion();
  } else if (currentMode === 'relative') {
    generateRelativeQuestion();
  } else if (currentMode === 'knuckle') {
    generateKnuckleQuestion();
  }
}

function generateDateQuestion() {
  const { firstDayWeekday, totalDays } = getMonthData(YEAR, currentMonth);
  const types = ['specificDay', 'whichSunday', 'lastDay', 'whichSat'];
  const type = types[Math.floor(Math.random() * types.length)];
  
  if (type === 'specificDay') {
    const targetDay = Math.floor(Math.random() * totalDays) + 1;
    currentQuestion = {
      target: targetDay,
      title: `👉 ${currentMonth}월 ${targetDay}일은 무슨 요일일까? 터치해 봐!`,
      sub: `${targetDay}일을 누르면 요일을 알 수 있어요!`
    };
  } else if (type === 'whichSunday') {
    const sundays = [];
    for (let d = 1; d <= totalDays; d++) {
      if ((firstDayWeekday + d - 1) % 7 === 0) sundays.push(d);
    }
    const nth = Math.floor(Math.random() * sundays.length);
    const ordinals = ["첫 번째", "두 번째", "세 번째", "네 번째", "다섯 번째"];
    currentQuestion = {
      target: sundays[nth],
      title: `🔴 빨간 일요일! ${ordinals[nth]} 일요일은 며칠일까?`,
      sub: "빨간색 일요일 기둥을 위에서부터 차례로 세어보세요!"
    };
  } else if (type === 'lastDay') {
    currentQuestion = {
      target: totalDays,
      title: `🏁 ${currentMonth}월의 맨 마지막 날은 며칠일까?`,
      sub: "달력의 맨 끝에 있는 가장 큰 숫자를 찾아보세요!"
    };
  } else {
    const sats = [];
    for (let d = 1; d <= totalDays; d++) {
      if ((firstDayWeekday + d - 1) % 7 === 6) sats.push(d);
    }
    const nth = Math.floor(Math.random() * sats.length);
    const ordinals = ["첫 번째", "두 번째", "세 번째", "네 번째", "다섯 번째"];
    currentQuestion = {
      target: sats[nth],
      title: `🔵 파란 토요일! ${ordinals[nth]} 토요일을 찾아줘!`,
      sub: "파란색 토요일 줄을 1등부터 차례대로 찾아보세요!"
    };
  }

  document.getElementById('missionBadge').textContent = `${currentMonth}월 탐험`;
  document.getElementById('missionTitle').textContent = currentQuestion.title;
  document.getElementById('missionSub').textContent = currentQuestion.sub;
}

function generateRelativeQuestion() {
  const virtualToday = 15;
  const { totalDays } = getMonthData(YEAR, currentMonth);
  const types = ['tomorrow', 'yesterday', 'nextWeek', 'prevWeek'];
  const type = types[Math.floor(Math.random() * types.length)];

  if (type === 'tomorrow') {
    currentQuestion = {
      target: virtualToday + 1,
      title: `🌟 오늘(${virtualToday}일)의 '내일'은 며칠일까?`,
      sub: "오늘 바로 오른쪽 칸으로 한 칸 퐁당!"
    };
  } else if (type === 'yesterday') {
    currentQuestion = {
      target: virtualToday - 1,
      title: `🕰️ 오늘(${virtualToday}일)의 '어제'는 며칠이었을까?`,
      sub: "오늘 바로 왼쪽 앞 칸으로 한 칸 쏙!"
    };
  } else if (type === 'nextWeek') {
    currentQuestion = {
      target: virtualToday + 7,
      title: `📅 오늘(${virtualToday}일)부터 일주일 뒤(다음 주 같은 요일)는?`,
      sub: "일주일(7일) 뒤는 오늘 바로 아랫칸 엘리베이터 슝!"
    };
  } else {
    currentQuestion = {
      target: virtualToday - 7,
      title: `⏮️ 오늘(${virtualToday}일)의 지난주 같은 요일은?`,
      sub: "일주일 전은 오늘 바로 윗칸으로 올라가요!"
    };
  }

  document.getElementById('missionBadge').textContent = '시간 여행';
  document.getElementById('missionTitle').textContent = currentQuestion.title;
  document.getElementById('missionSub').textContent = currentQuestion.sub;
}

function onDateClicked(day, cellElem) {
  if (isWaiting) return;
  const { firstDayWeekday } = getMonthData(YEAR, currentMonth);
  const fb = document.getElementById('feedbackMsg');
  const weekday = WEEKDAYS[(firstDayWeekday + day - 1) % 7];

  if (day === currentQuestion.target) {
    isWaiting = true;
    score += 10;
    document.getElementById('scoreDisplay').textContent = `⭐ ${score}점`;
    cellElem.classList.add('correct-anim');
    fb.className = 'feedback-banner fb-good';
    fb.textContent = `🎉 딩동댕! 맞았어요! (${day}일 ${weekday}요일)`;
    setTimeout(() => {
      cellElem.classList.remove('correct-anim');
      newQuestion();
    }, 1200);
  } else {
    cellElem.classList.add('wrong-anim');
    fb.className = 'feedback-banner fb-bad';
    fb.textContent = `❌ 여긴 ${day}일(${weekday}요일)이에요! 다시 찾아볼까요?`;
    setTimeout(() => cellElem.classList.remove('wrong-anim'), 600);
  }
}

let currentMonthTarget = 1;
function generateKnuckleQuestion() {
  currentMonthTarget = Math.floor(Math.random() * 12) + 1;
  document.getElementById('knuckleMonthText').textContent = `✨ ${currentMonthTarget}월은 며칠까지 있을까?`;
}

function answerKnuckle(choice) {
  if (isWaiting) return;
  const actualDays = MONTH_DAYS[currentMonthTarget];
  const isCorrect = (choice === 31 && actualDays === 31) || (choice === 30 && actualDays <= 30);
  const fb = document.getElementById('feedbackMsg');

  if (isCorrect) {
    isWaiting = true;
    score += 10;
    document.getElementById('scoreKnuckleDisplay').textContent = `⭐ ${score}점`;
    fb.className = 'feedback-banner fb-good';
    fb.textContent = `🎉 정답! ${currentMonthTarget}월은 ${actualDays}일까지 있어요!`;
    setTimeout(() => newQuestion(), 1200);
  } else {
    fb.className = 'feedback-banner fb-bad';
    fb.textContent = `❌ 앗, 주먹 뼈를 다시 세어보자! ${currentMonthTarget}월은 ${actualDays}일까지예요!`;
  }
}
</script>
</body>
</html>
