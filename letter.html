<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>지유를 위한 아빠의 비밀 선물상자 🎁</title>
<!-- 동글동글 귀여운 폰트 로드 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    font-family: 'Gaegu', cursive, -apple-system, sans-serif; 
    -webkit-tap-highlight-color: transparent; 
  }
  
  body {
    margin: 0;
    min-height: 100vh;
    background: #fff5f8;
    background-image: 
      radial-gradient(#ffd1dc 15%, transparent 16%),
      radial-gradient(#dcfce7 15%, transparent 16%);
    background-size: 36px 36px;
    background-position: 0 0, 18px 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* 파티클 캔버스 */
  #confettiCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  /* 1. 선물상자 봉투 인트로 화면 */
  .intro-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    z-index: 10;
    text-align: center;
  }
  .intro-box:active { transform: scale(0.96); }

  .bear-friend {
    font-size: 4rem;
    animation: bearWiggle 1.8s infinite ease-in-out;
    margin-bottom: -15px;
    z-index: 2;
  }

  @keyframes bearWiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }

  .gift-box {
    width: 220px;
    height: 160px;
    background: #ffb6c1;
    border: 5px solid #ff8da1;
    border-radius: 28px;
    position: relative;
    box-shadow: 0 14px 0 #ffa3b3, 0 20px 25px rgba(255, 141, 161, 0.35);
    display: flex;
    justify-content: center;
    align-items: center;
    animation: jellyHop 2s infinite ease-in-out;
  }

  /* 십자 선물 리본 */
  .gift-box::before {
    content: "";
    position: absolute;
    width: 34px;
    height: 100%;
    background: #fff;
    border-radius: 4px;
  }
  .gift-box::after {
    content: "";
    position: absolute;
    height: 34px;
    width: 100%;
    background: #fff;
    border-radius: 4px;
  }

  .ribbon-center {
    position: relative;
    z-index: 3;
    font-size: 3.2rem;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    animation: heartBeat 1.2s infinite;
  }

  @keyframes jellyHop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    50% { transform: translateY(-16px) scale(1.05, 0.95); }
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .tap-pill {
    margin-top: 24px;
    font-size: 1.6rem;
    font-weight: 700;
    color: #ff5e7e;
    background: #ffffff;
    border: 3px solid #ffccd5;
    padding: 8px 24px;
    border-radius: 40px;
    box-shadow: 0 6px 0 #ffd6de;
    animation: pulseBtn 1.5s infinite;
  }

  @keyframes pulseBtn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* 2. 펼쳐진 아기자기 편지 카드 */
  .cute-card {
    display: none;
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 36px;
    border: 6px solid #ffd1dc;
    box-shadow: 0 16px 0 #ffccd5, 0 25px 40px rgba(255, 182, 193, 0.3);
    padding: 30px 22px 24px;
    position: relative;
    z-index: 10;
    transform: scale(0.6) rotate(-3deg);
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .cute-card.open {
    display: block;
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }

  /* 상단 마스킹 테이프 장식 */
  .cute-card::before {
    content: "🍓 J I Y U 🍓";
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    background: #fef08a;
    border: 2px dashed #facc15;
    color: #a16207;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 3px 20px;
    border-radius: 6px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.06);
  }

  /* 네 모퉁이 스티커 데코 */
  .deco-corner-tl { position: absolute; top: 12px; left: 14px; font-size: 1.8rem; }
  .deco-corner-tr { position: absolute; top: 12px; right: 14px; font-size: 1.8rem; }

  .letter-title {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 700;
    color: #ff5e7e;
    margin: 8px 0 16px;
    text-shadow: 1px 1px 0 #ffe4e6;
  }

  /* 공책 줄노트 스타일 */
  .note-paper {
    background: #fffdfa;
    border: 3px solid #fed7aa;
    border-radius: 24px;
    padding: 18px 16px;
    font-size: 1.55rem;
    line-height: 1.7;
    color: #4338ca;
    word-break: keep-all;
    box-shadow: inset 0 0 10px rgba(254, 215, 170, 0.2);
  }

  /* 크레파스 밑줄 & 형광펜 */
  .mark-yellow {
    background: linear-gradient(transparent 55%, #fef08a 55%);
    font-weight: 700;
    color: #1e1b4b;
    padding: 0 4px;
    border-radius: 4px;
  }
  .mark-mint {
    background: linear-gradient(transparent 55%, #a7f3d0 55%);
    font-weight: 700;
    color: #064e3b;
    padding: 0 4px;
    border-radius: 4px;
  }
  .mark-pink {
    color: #e11d48;
    font-weight: 700;
  }

  /* 하단 귀여운 푸터 버튼 */
  .card-footer {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .love-sign {
    font-size: 1.9rem;
    font-weight: 700;
    color: #ff5e7e;
    text-align: center;
  }

  .btn-cute-heart {
    background: #ff5e7e;
    border: 3px solid #ffffff;
    color: white;
    font-size: 1.55rem;
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 30px;
    box-shadow: 0 6px 0 #d94668, 0 10px 15px rgba(255, 94, 126, 0.35);
    cursor: pointer;
    transition: 0.1s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-cute-heart:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #d94668;
  }

  /* 배경 둥둥 캔디/별 */
  .floating-candy {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    animation: drift 7s infinite linear;
  }

  @keyframes drift {
    0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
    20% { opacity: 0.8; }
    80% { opacity: 0.8; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<!-- 1. 통통 튀는 선물상자 인트로 -->
<div class="intro-box" id="introBox" onclick="openCuteLetter()">
  <div class="bear-friend">🧸</div>
  <div class="gift-box">
    <div class="ribbon-center">🎀</div>
  </div>
  <div class="tap-pill">💌 지유에게 온 깜짝 선물! 톡!</div>
</div>

<!-- 2. 다이어리 스티커 감성의 편지 카드 -->
<div class="cute-card" id="cuteCard">
  <div class="deco-corner-tl">🌷</div>
  <div class="deco-corner-tr">🐥</div>

  <div class="letter-title">
    🧸 사랑하는 우리 딸 지유야! 🌸
  </div>

  <div class="note-paper">
    아빠가 오늘 집에 늦게 들어 갈 것 같아서,<br>
    이렇게 <span class="mark-pink">비밀 편지</span>로 얘기해 💌<br><br>
    어제 아빠가 화 많이 내서 정말 미안해 🥺<br><br>
    아빠는 지유가 <span class="mark-yellow">공부를 잘하는 걸 바라진 않아.</span><br>
    공부하더라도 짜증내지 않고,<br>
    화내지 않고 했으면 해 🍦<br><br>
    제일 중요한 건 지유가 뭘 하더라도<br>
    <span class="mark-mint">신나고 재미있게 하는 거야! 🎡✨</span>
  </div>

  <div class="card-footer">
    <div class="love-sign">
      💖 아빠가 지유를 제일 많이 사랑해! 💖
    </div>
    <button class="btn-cute-heart" onclick="popMoreHearts()">
      아빠 사랑 팡팡 터뜨리기! 🍬💕
    </button>
  </div>
</div>

<script>
// 배경 귀여운 이모티콘 둥둥 띄우기
const candys = ['🍭', '🍓', '🎀', '⭐', '🎈', '🧸', '🐣', '🌸', '✨'];
for (let i = 0; i < 16; i++) {
  const el = document.createElement('div');
  el.className = 'floating-candy';
  el.textContent = candys[Math.floor(Math.random() * candys.length)];
  el.style.left = Math.random() * 92 + 'vw';
  el.style.fontSize = (Math.random() * 1.3 + 1.2) + 'rem';
  el.style.animationDelay = (Math.random() * 6) + 's';
  el.style.animationDuration = (Math.random() * 4 + 6) + 's';
  document.body.appendChild(el);
}

// 편지 열기
function openCuteLetter() {
  document.getElementById('introBox').style.display = 'none';
  const card = document.getElementById('cuteCard');
  card.classList.add('open');
  burstConfetti(100);
}

function popMoreHearts() {
  burstConfetti(60);
}

// 달콤한 파스텔 폭죽 파티클
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function burstConfetti(count) {
  const cuteIcons = ['💖', '🍬', '🍭', '⭐', '🌸', '🍓', '✨', '💕'];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.75) * 18,
      size: Math.random() * 18 + 14,
      icon: cuteIcons[Math.floor(Math.random() * cuteIcons.length)],
      alpha: 1,
      decay: Math.random() * 0.015 + 0.008,
      gravity: 0.32
    });
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.alpha -= p.decay;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.font = `${p.size}px 'Gaegu', cursive, sans-serif`;
    ctx.fillText(p.icon, p.x, p.y);
    ctx.restore();
  }
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
